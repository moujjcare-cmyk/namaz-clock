name: Build Native Masjid Clock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Build Web Folder
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Generate Mosque App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -sL "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f54c.png" -o mosque_raw.png
          convert -size 512x512 xc:"#0b1015" \( mosque_raw.png -resize 340x340 \) -gravity center -composite icon_512.png
          RES="android/app/src/main/res"
          rm -rf $RES/mipmap-anydpi-v26
          for dir in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder="${dir%%:*}"
            size="${dir##*:}"
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_round.png
            convert icon_512.png -resize ${size}x${size} $RES/mipmap-$folder/ic_launcher_foreground.png
          done

      - name: Configure Native Permissions & Boot Receiver in Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" \/>\n    <application/' "$MANIFEST"
          sed -i 's/<\/application>/<receiver android:name=".PrayerAlarmReceiver" android:enabled="true" android:exported="true">\n        <intent-filter>\n            <action android:name="android.intent.action.BOOT_COMPLETED" \/>\n            <action android:name="android.intent.action.QUICKBOOT_POWERON" \/>\n            <action android:name="android.intent.action.TIME_SET" \/>\n            <action android:name="android.intent.action.TIMEZONE_CHANGED" \/>\n        <\/intent-filter>\n    <\/receiver>\n    <\/application>/' "$MANIFEST"

      - name: Create Multi-Device Compatible Alarm Receiver & Bridge
        run: |
          PKG_DIR="android/app/src/main/java/com/dreamavenue/mosqueclock"
          mkdir -p "$PKG_DIR"

          # 1. PrayerAlarmReceiver.java (Works across Samsung, Xiaomi, Vivo, Oppo, Realme, Infinix, Stock Android)
          cat << 'EOF' > "$PKG_DIR/PrayerAlarmReceiver.java"
          package com.dreamavenue.mosqueclock;

          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioManager;
          import android.os.Build;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class PrayerAlarmReceiver extends BroadcastReceiver {
              private static final String PREFS_NAME = "MasjidClockPrefs";

              public static void scheduleExactWakeup(Context context, AlarmManager am, long triggerAtMillis, PendingIntent operation) {
                  if (am == null) return;
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          Intent showIntent = new Intent(context, MainActivity.class);
                          PendingIntent showPi = PendingIntent.getActivity(
                              context, 0, showIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0)
                          );
                          AlarmManager.AlarmClockInfo info = new AlarmManager.AlarmClockInfo(triggerAtMillis, showPi);
                          am.setAlarmClock(info, operation);
                          return;
                      }
                  } catch (Exception ignored) {}

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, operation);
                      } else {
                          am.setExact(AlarmManager.RTC_WAKEUP, triggerAtMillis, operation);
                      }
                  } catch (Exception ignored) {}
              }

              public static void scheduleFromSavedJson(Context context, String jsonString) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am == null || jsonString == null) return;

                      int baseCode = 2000;
                      for (int i = 0; i < 15; i++) {
                          Intent cancelIntent = new Intent(context, PrayerAlarmReceiver.class);
                          PendingIntent cancelPi = PendingIntent.getBroadcast(
                              context, baseCode + i, cancelIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          am.cancel(cancelPi);
                      }

                      if (jsonString.isEmpty() || "[]".equals(jsonString.trim())) return;

                      JSONArray arr = new JSONArray(jsonString);
                      long nowMs = System.currentTimeMillis();

                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject obj = arr.getJSONObject(i);
                          int hr = obj.getInt("h");
                          int min = obj.getInt("m");
                          int pre = obj.getInt("pre");
                          int dur = Math.max(1, obj.getInt("dur"));

                          Calendar cal = Calendar.getInstance();
                          cal.set(Calendar.HOUR_OF_DAY, hr);
                          cal.set(Calendar.MINUTE, min);
                          cal.set(Calendar.SECOND, 0);
                          cal.set(Calendar.MILLISECOND, 0);
                          cal.add(Calendar.MINUTE, -pre);

                          long startMs = cal.getTimeInMillis();
                          long endMs = startMs + (dur * 60L * 1000L);

                          // If currently inside this prayer's silent window right now, engage silent mode for remaining time
                          if (nowMs >= startMs && nowMs < endMs) {
                              int remainingMins = (int) Math.max(1L, Math.ceil((endMs - nowMs) / 60000.0));
                              applySilentState(context, true, remainingMins);
                          }

                          if (startMs <= nowMs) {
                              cal.add(Calendar.DAY_OF_YEAR, 1);
                              startMs = cal.getTimeInMillis();
                          }

                          Intent alarmIntent = new Intent(context, PrayerAlarmReceiver.class);
                          alarmIntent.putExtra("ACTION_TYPE", "START_SILENT");
                          alarmIntent.putExtra("DURATION_MINS", dur);
                          alarmIntent.putExtra("HOUR", cal.get(Calendar.HOUR_OF_DAY));
                          alarmIntent.putExtra("MINUTE", cal.get(Calendar.MINUTE));
                          alarmIntent.putExtra("REQ_CODE", baseCode + i);

                          PendingIntent pi = PendingIntent.getBroadcast(
                              context, baseCode + i, alarmIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          scheduleExactWakeup(context, am, startMs, pi);
                      }
                  } catch (Exception ignored) {}
              }

              public static void applySilentState(Context context, boolean enableSilent, int durationMins) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || !nm.isNotificationPolicyAccessGranted()) return;

                  AudioManager audio = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);

                  Intent restoreIntent = new Intent(context, PrayerAlarmReceiver.class);
                  restoreIntent.putExtra("ACTION_TYPE", "STOP_SILENT");
                  PendingIntent restorePi = PendingIntent.getBroadcast(
                      context, 9999, restoreIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  if (enableSilent) {
                      try {
                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                      } catch (Exception e) {
                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                      }
                      try {
                          if (audio != null) audio.setRingerMode(AudioManager.RINGER_MODE_SILENT);
                      } catch (Exception ignored) {}

                      long restoreTime = System.currentTimeMillis() + (Math.max(1, durationMins) * 60L * 1000L);
                      scheduleExactWakeup(context, am, restoreTime, restorePi);
                  } else {
                      if (am != null) am.cancel(restorePi);
                      try {
                          nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                      } catch (Exception ignored) {}
                      try {
                          if (audio != null) audio.setRingerMode(AudioManager.RINGER_MODE_NORMAL);
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String sysAction = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(sysAction) ||
                      "android.intent.action.QUICKBOOT_POWERON".equals(sysAction) ||
                      Intent.ACTION_TIME_CHANGED.equals(sysAction) ||
                      Intent.ACTION_TIMEZONE_CHANGED.equals(sysAction)) {
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      String savedJson = prefs.getString("smart_alarms_json", "");
                      if (savedJson != null && !savedJson.isEmpty()) {
                          scheduleFromSavedJson(context, savedJson);
                      }
                      return;
                  }

                  String action = intent.getStringExtra("ACTION_TYPE");
                  if ("START_SILENT".equals(action)) {
                      int durationMins = intent.getIntExtra("DURATION_MINS", 20);
                      applySilentState(context, true, durationMins);

                      // Schedule next day's occurrence for this prayer slot
                      int hour = intent.getIntExtra("HOUR", -1);
                      int minute = intent.getIntExtra("MINUTE", -1);
                      int reqCode = intent.getIntExtra("REQ_CODE", 2000);
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (hour >= 0 && minute >= 0 && am != null) {
                          Calendar nextCal = Calendar.getInstance();
                          nextCal.add(Calendar.DAY_OF_YEAR, 1);
                          nextCal.set(Calendar.HOUR_OF_DAY, hour);
                          nextCal.set(Calendar.MINUTE, minute);
                          nextCal.set(Calendar.SECOND, 0);
                          nextCal.set(Calendar.MILLISECOND, 0);

                          Intent nextIntent = new Intent(context, PrayerAlarmReceiver.class);
                          nextIntent.putExtra("ACTION_TYPE", "START_SILENT");
                          nextIntent.putExtra("DURATION_MINS", durationMins);
                          nextIntent.putExtra("HOUR", hour);
                          nextIntent.putExtra("MINUTE", minute);
                          nextIntent.putExtra("REQ_CODE", reqCode);

                          PendingIntent nextPi = PendingIntent.getBroadcast(
                              context, reqCode, nextIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          scheduleExactWakeup(context, am, nextCal.getTimeInMillis(), nextPi);
                      }
                  } else if ("STOP_SILENT".equals(action)) {
                      applySilentState(context, false, 0);
                  }
              }
          }
          EOF

          # 2. MainActivity.java
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.dreamavenue.mosqueclock;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final String PREFS_NAME = "MasjidClockPrefs";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new SilentBridge(this), "AndroidSilentBridge");
              }

              public class SilentBridge {
                  Context mContext;
                  SilentBridge(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void requestPermissions() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                              Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              mContext.startActivity(intent);
                              return;
                          }
                          PowerManager pm = (PowerManager) mContext.getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(mContext.getPackageName())) {
                              try {
                                  Intent bIntent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                  bIntent.setData(Uri.parse("package:" + mContext.getPackageName()));
                                  bIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  mContext.startActivity(bIntent);
                                  return;
                              } catch (Exception ignored) {}
                          }
                          new Handler(Looper.getMainLooper()).post(() ->
                              Toast.makeText(mContext, "DND & Background Permissions Granted!", Toast.LENGTH_SHORT).show()
                          );
                      }
                  }

                  @JavascriptInterface
                  public void setSilentMode(boolean enable, int durationMins, String prayerLabel) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          NotificationManager nm = (NotificationManager) mContext.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.isNotificationPolicyAccessGranted()) {
                              int actualMins = (prayerLabel != null && (prayerLabel.contains("ٹیسٹ") || prayerLabel.toLowerCase().contains("test")))
                                  ? 2 : Math.max(1, durationMins);
                              PrayerAlarmReceiver.applySilentState(mContext, enable, actualMins);
                              if (enable) {
                                  new Handler(Looper.getMainLooper()).post(() ->
                                      Toast.makeText(mContext, "Silent Mode (DND) ON for " + actualMins + " mins", Toast.LENGTH_SHORT).show()
                                  );
                              }
                          } else {
                              requestPermissions();
                          }
                      }
                  }

                  @JavascriptInterface
                  public void scheduleSmartAlarms(String jsonString) {
                      try {
                          SharedPreferences prefs = mContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          prefs.edit().putString("smart_alarms_json", jsonString != null ? jsonString : "").apply();
                          PrayerAlarmReceiver.scheduleFromSavedJson(mContext, jsonString);
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-Clock-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
